<div class="comment-item">

  <!-- Comment -->
  <div class="comment-content">

    <div class="comment-header">
      <strong>{{ comment.author }}</strong>

      <span>
        {{ comment.createdAt | date: 'MMM d, y, h:mm a' }}
      </span>
    </div>

    <p class="comment-text">
      {{ comment.content }}
    </p>

    <button
      type="button"
      class="reply-btn"
      (click)="toggleReply()"
    >
      <i class="bi bi-reply me-1"></i>
      Reply
    </button>

  </div>

  <!-- Reply Form -->
  @if (isReplying) {

    <div class="reply-form mt-3">

      <textarea
        class="form-control"
        rows="2"
        placeholder="Write a reply..."
        [(ngModel)]="replyText"
      ></textarea>

      <div class="reply-actions mt-2">

        <button
          type="button"
          class="btn btn-sm btn-dark"
          (click)="submitReply()"
        >
          Reply
        </button>

        <button
          type="button"
          class="btn btn-sm btn-light"
          (click)="toggleReply()"
        >
          Cancel
        </button>

      </div>

    </div>

  }

  <!-- Nested Replies -->
  @if (comment.replies.length > 0) {

    <div class="nested-replies">

      @for (reply of comment.replies; track reply.id) {

        <app-comment-item
          [comment]="reply"
          (replyAdded)="replyAdded.emit($event)"
        ></app-comment-item>

      }

    </div>

  }

</div>
